appId: com.parmscript.trickle
---
- launchApp:
    clearState: false
- tapOn:
    text: "Back"
    optional: true
- tapOn:
    text: "Back"
    optional: true
- assertVisible: "Library"
- tapOn: "Search"
- assertVisible: "Search library"
- swipe:
    start: "1%, 40%"
    end: "90%, 40%"
    duration: 500
- assertVisible: "Library"
- waitForAnimationToEnd
- takeScreenshot: "store/apple/screenshots/01-home"
- tapOn: "Podcasts.*"
- tapOn: "Podcast Neon Dispatch. trickle studio"
- assertVisible: "Episodes"
- waitForAnimationToEnd
- takeScreenshot: "store/apple/screenshots/02-podcast"
- tapOn: ".*Signal Check: Listening without friction.*"
- assertVisible: "Show notes"
- waitForAnimationToEnd
- takeScreenshot: "store/apple/screenshots/03-episode"
- swipe:
    start: "1%, 40%"
    end: "90%, 40%"
    duration: 500
- assertVisible: "Episodes"
- swipe:
    start: "1%, 40%"
    end: "90%, 40%"
    duration: 500
- assertVisible: "Podcasts"
- swipe:
    start: "1%, 40%"
    end: "90%, 40%"
    duration: 500
- assertVisible: "Library"
- scrollUntilVisible:
    element: "See all unread feed items"
    direction: DOWN
- tapOn: "See all unread feed items"
- assertVisible: ".*All feeds.*"
- waitForAnimationToEnd
- takeScreenshot: "store/apple/screenshots/04-unread"
- tapOn: ".*A calmer way to follow the web.*"
- assertVisible: "Reader"
- waitForAnimationToEnd
- takeScreenshot: "store/apple/screenshots/05-reader"
- swipe:
    start: "1%, 40%"
    end: "90%, 40%"
    duration: 500
- assertVisible: ".*All feeds.*"
